title: Built on Better Auth
description: Leverage the full power of Better Auth with a Nuxt-native developer experience.
items:
  - title: '27+ Plugins'
    description: 'Two-factor auth, organizations, API keys, magic links, and more. All plugins work out of the box.'
    icon: i-lucide-puzzle
  - title: '33+ OAuth Providers'
    description: 'Google, GitHub, Discord, Apple, and 30+ more social providers ready to use.'
    icon: i-lucide-key-round
  - title: Database Flexibility
    description: 'Works without a database for OAuth-only, or integrates with NuxtHub for full persistence.'
    icon: i-lucide-database
  - title: Auto Schema Generation
    description: Auth tables generated automatically from your plugins. Zero manual migrations.
    icon: i-lucide-wand
  - title: SSR-Safe Sessions
    description: useUserSession keeps session state consistent from SSR hydration through client updates.
    icon: i-lucide-shield-check
  - title: Declarative Route Protection
    description: 'Protect routes with routeRules. Define auth requirements once, enforce everywhere.'
    icon: i-lucide-lock
