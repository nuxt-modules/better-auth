shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  vue-demi: true
  workerd: true
packages:
  - docs
  - playground
overrides:
  '@tailwindcss/node': 4.3.0
  '@tailwindcss/oxide': 4.3.0
  '@tailwindcss/postcss': 4.3.0
  '@tailwindcss/vite': 4.3.0
  tailwindcss: 4.3.0
patchedDependencies:
  '@peculiar/x509@1.14.3': patches/@peculiar__x509@1.14.3.patch
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - better-sqlite3
  - esbuild
  - prisma
  - sharp
  - vue-demi
  - workerd
